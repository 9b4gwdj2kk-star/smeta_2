<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Смета ремонта</title>
<meta name="theme-color" content="#E7EAE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111412" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Смета">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  /* Шрифты подгружаются без блокировки: пока их нет, страница уже видна на системном шрифте */
  (function () {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600&display=swap';
    document.head.appendChild(l);
  })();
</script>
<style>
/* Layout: одна колонка до 560px из блоков-списков; снизу закреплена кнопка «+ Расход»;
   ввод — полноэкранная панель, «Сохранить» в шапке, чтобы клавиатура её не закрывала.
   Мотив: прогресс-бар как жёлтая лента строительной рулетки с делениями. */
:root {
  --bg: #E7EAE6;          /* бетонная стяжка */
  --bg-0: rgba(231, 234, 230, 0);
  --surface: #FFFFFF;
  --sunk: #F0F2EF;
  --ink: #1A201C;
  --muted: #5E6862;
  --line: #D3D8D2;
  --tape: #F0BC28;        /* лента рулетки */
  --tape-ink: #2B2205;
  --tick: rgba(43, 34, 5, .42);
  --neutral: #B6BDB6;
  --ok: #2B7347;  --ok-bg: #E0F0E6;
  --warn: #965E0C; --warn-bg: #F6EAD3;
  --bad: #B53325; --bad-bg: #F7DFDA;
  --btn: #1A201C; --btn-ink: #F5F7F3;
  --toast-act: #F0BC28;
  --shadow: rgba(16, 22, 18, .16);
  --f-display: 'Unbounded', 'Manrope', system-ui, sans-serif;
  --f-text: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111412; --bg-0: rgba(17, 20, 18, 0); --surface: #1B1F1C; --sunk: #242925; --ink: #E8ECE7;
    --muted: #98A19B; --line: #313833; --tape: #E6B526; --tape-ink: #1D1703; --tick: rgba(29, 23, 3, .5);
    --neutral: #4C5650; --ok: #62BE87; --ok-bg: #18311F; --warn: #E4A84E; --warn-bg: #382A12;
    --bad: #F06D5D; --bad-bg: #3D1C18; --btn: #E8ECE7; --btn-ink: #111412; --toast-act: #7A5800;
    --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111412; --bg-0: rgba(17, 20, 18, 0); --surface: #1B1F1C; --sunk: #242925; --ink: #E8ECE7;
  --muted: #98A19B; --line: #313833; --tape: #E6B526; --tape-ink: #1D1703; --tick: rgba(29, 23, 3, .5);
  --neutral: #4C5650; --ok: #62BE87; --ok-bg: #18311F; --warn: #E4A84E; --warn-bg: #382A12;
  --bad: #F06D5D; --bad-bg: #3D1C18; --btn: #E8ECE7; --btn-ink: #111412; --toast-act: #7A5800;
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark;
}

[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
p, h1, h2 { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: center; }
input, textarea { font: inherit; color: inherit; margin: 0; }

/* Утилиты (вместо Tailwind CDN — всё встроено, чтобы страница открывалась сразу) */
.mx-auto { margin-left: auto; margin-right: auto; }
.max-w-\[560px\] { max-width: 560px; }
.flex { display: flex; } .flex-col { flex-direction: column; } .flex-wrap { flex-wrap: wrap; }
.grid { display: grid; } .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.block { display: block; } .flex-1 { flex: 1 1 0%; } .min-w-0 { min-width: 0; } .w-full { width: 100%; }
.whitespace-nowrap { white-space: nowrap; }
.items-end { align-items: flex-end; } .items-center { align-items: center; } .items-baseline { align-items: baseline; }
.justify-between { justify-content: space-between; }
.gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-5 { gap: 20px; }
.gap-x-4 { column-gap: 16px; } .gap-y-1 { row-gap: 4px; }
.pt-1 { padding-top: 4px; } .pb-1 { padding-bottom: 4px; } .pt-3 { padding-top: 12px; }
.px-1 { padding-left: 4px; padding-right: 4px; } .p-4 { padding: 16px; } .p-5 { padding: 20px; }
.mt-1 { margin-top: 4px; } .mt-2 { margin-top: 8px; } .mt-3 { margin-top: 12px; }
.border-t { border-top: 1px solid var(--line); }
.text-\[12\.5px\] { font-size: 12.5px; } .text-\[13px\] { font-size: 13px; } .text-\[13\.5px\] { font-size: 13.5px; }
.text-\[14px\] { font-size: 14px; } .text-\[17px\] { font-size: 17px; } .text-\[23px\] { font-size: 23px; }
.text-\[38px\] { font-size: 38px; } .text-\[40px\] { font-size: 40px; }
@media (min-width: 640px) { .sm\:text-\[42px\] { font-size: 42px; } }
.font-semibold { font-weight: 600; } .font-bold { font-weight: 700; }
.leading-tight { line-height: 1.2; } .leading-none { line-height: 1; }

html { background: var(--bg); }
main > section:empty { display: none; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-text); font-size: 15px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
.num { font-variant-numeric: tabular-nums; }
.disp { font-family: var(--f-display); }
h1, h2 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }

.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: calc(12px + env(safe-area-inset-top, 0px));
  padding-bottom: 128px;
}
.eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--neutral); }
.status.ok i { background: var(--ok); }
.status.warn i { background: var(--warn); }
.status.bad i { background: var(--bad); }

/* Блоки */
.panel { background: var(--surface); border-radius: 18px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px 8px; }
.sec-h h2 { font-family: var(--f-display); font-size: 14.5px; font-weight: 600; letter-spacing: .01em; }
.link {
  color: var(--ink); font-weight: 700; font-size: 13.5px; text-decoration: underline;
  text-underline-offset: 3px; text-decoration-color: var(--tape); text-decoration-thickness: 2px; padding: 4px 0;
}
.list { background: var(--surface); border-radius: 18px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; min-height: 58px; color: var(--ink); }
.row + .row, .row + .mhead, .mhead + .row { border-top: 1px solid var(--line); }
button.row:active { background: var(--sunk); }
.row .t { font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.row .m { font-size: 13px; color: var(--muted); }
.row .a { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.mhead { display: flex; justify-content: space-between; gap: 12px; padding: 10px 16px 8px; background: var(--sunk); font-size: 12.5px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.catrow { display: flex; flex-direction: column; gap: 7px; width: 100%; text-align: left; padding: 13px 16px; color: var(--ink); }
.catrow + .catrow, .row + .catrow, .catrow + .row { border-top: 1px solid var(--line); }
button.catrow:active { background: var(--sunk); }

/* Рулетка */
.tape { position: relative; height: 12px; border-radius: 3px; background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.tape.lg { height: 24px; border-radius: 4px; }
.tape > i {
  position: absolute; left: 0; top: 0; bottom: 0; width: var(--w, 0%); max-width: 100%;
  background-color: var(--tape);
  background-image:
    repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 6px),
    repeating-linear-gradient(90deg, var(--tick) 0 1px, transparent 1px 30px);
  background-size: 100% 32%, 100% 62%; background-repeat: no-repeat; background-position: 0 0, 0 0;
  transition: width .5s ease;
}
.tape.over > i { background-color: var(--bad); }
.tape.free > i { background-color: var(--neutral); background-image: none; }
.split { display: flex; height: 12px; border-radius: 3px; overflow: hidden; gap: 2px; }
.split > i { display: block; height: 100%; }

.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.warn { color: var(--warn); background: var(--warn-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.pill.neutral { color: var(--muted); background: var(--sunk); }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-muted { color: var(--muted); }

/* Нижняя кнопка */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  padding-top: 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: linear-gradient(to top, var(--bg) 64%, var(--bg-0));
}
.addbtn {
  width: 100%; height: 58px; border-radius: 16px; background: var(--btn); color: var(--btn-ink);
  font-family: var(--f-display); font-weight: 600; font-size: 16.5px; display: flex; align-items: center; justify-content: center; gap: 12px;
  box-shadow: 0 8px 22px var(--shadow);
}
.addbtn:active { transform: scale(.985); }
.plus { width: 28px; height: 28px; border-radius: 8px; background: var(--tape); color: var(--tape-ink); display: grid; place-items: center; font-size: 21px; line-height: 1; font-family: var(--f-text); font-weight: 800; }
.ghost { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 14px; padding: 11px 14px; font-weight: 700; font-size: 14px; }
.ghost:active { background: var(--sunk); }

/* Полноэкранные панели */
.sheet {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); opacity: 0; transform: translateY(18px);
  transition: opacity .18s ease, transform .22s cubic-bezier(.2, .8, .2, 1);
}
.sheet.open { opacity: 1; transform: none; }
.sheet-nav {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
  padding-top: 8px; padding-bottom: 8px;
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.sheet-nav h2 { font-weight: 700; font-size: 15.5px; text-align: center; white-space: nowrap; }
.nav-cancel { justify-self: start; padding: 10px 10px; font-weight: 600; color: var(--muted); font-size: 15px; }
.nav-save { justify-self: end; padding: 9px 16px; border-radius: 999px; background: var(--btn); color: var(--btn-ink); font-weight: 700; font-size: 15px; }
.sheet-body {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  padding-top: 16px; padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.amount-box { background: var(--surface); border-radius: 18px; padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 10px; }
.amount {
  font-family: var(--f-display); font-size: 38px; font-weight: 600; width: 100%; min-width: 0; background: transparent; border: 0;
  outline: none; color: var(--ink); letter-spacing: -.01em; font-variant-numeric: tabular-nums; padding: 0;
}
.amount::placeholder { color: var(--neutral); }
.cur { font-family: var(--f-display); font-size: 26px; font-weight: 500; color: var(--muted); }
.opchip { border: 1px solid var(--line); background: var(--sunk); border-radius: 10px; padding: 6px 11px; font-weight: 700; font-size: 13.5px; color: var(--ink); }
.field {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 13px; padding: 12px 14px;
  font-size: 16px; color: var(--ink); min-height: 48px; -webkit-appearance: none; appearance: none;
}
.field::placeholder { color: var(--muted); opacity: .75; }
.field:focus { outline: none; border-color: var(--ink); }
textarea.field { resize: vertical; min-height: 72px; }
input[type="date"].field { display: block; text-align: left; }
input[type="date"].field::-webkit-date-and-time-value { text-align: left; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px;
  padding: 9px 14px; font-weight: 700; font-size: 14.5px; line-height: 1.2;
}
.chip[aria-pressed="true"] { background: var(--tape); border-color: var(--tape); color: var(--tape-ink); }
.chip.attn { border-color: var(--bad); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sunk); border: 1px solid var(--line); border-radius: 13px; padding: 3px; gap: 3px; }
.seg > button { padding: 9px 10px; border-radius: 10px; font-weight: 700; font-size: 14.5px; color: var(--muted); }
.seg > button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px var(--shadow); }
.bigbtn { width: 100%; height: 54px; border-radius: 15px; background: var(--btn); color: var(--btn-ink); font-weight: 800; font-size: 16px; }
.delbtn { width: 100%; height: 50px; border-radius: 15px; border: 1.5px solid var(--line); color: var(--bad); font-weight: 700; font-size: 15px; background: transparent; }
.delbtn.armed { background: var(--bad); border-color: var(--bad); color: var(--btn-ink); }
.err { color: var(--bad); font-weight: 700; font-size: 13.5px; min-height: 1.2em; }
.infobox { background: var(--surface); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 13.5px; }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(90px + env(safe-area-inset-bottom, 0px));
  background: var(--btn); color: var(--btn-ink); border-radius: 14px; padding: 9px 9px 9px 16px;
  display: flex; gap: 10px; align-items: center; width: max-content; max-width: calc(100% - 32px);
  box-shadow: 0 10px 28px var(--shadow); font-weight: 600; font-size: 14px;
}
.toast.solo { padding: 12px 16px; }
.toast button { color: var(--toast-act); font-weight: 800; padding: 6px 10px; white-space: nowrap; }
.copybox { width: 100%; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }

.skel { color: var(--line); }
@media (prefers-reduced-motion: reduce) {
  .sheet, .tape > i, .addbtn { transition: none; }
}
</style>
</head>
<body>

<div class="wrap">
  <main class="mx-auto max-w-[560px] flex flex-col gap-5">
    <header class="flex items-end justify-between gap-3 pt-1">
      <div class="min-w-0">
        <p class="eyebrow">Ремонт квартиры</p>
        <h1 class="disp text-[23px] font-semibold leading-tight mt-1">Смета ремонта</h1>
      </div>
      <span id="status" class="status pb-1"><i></i><span>загрузка…</span></span>
    </header>

    <section id="summary" aria-label="Итог"></section>
    <section id="split" aria-label="Работа и материалы"></section>
    <section id="recent" aria-label="Последние расходы"></section>
    <section id="catsec" aria-label="Категории"></section>
    <section id="fundsec" aria-label="Деньги на ремонт"></section>
    <footer id="foot" class="flex flex-col gap-3 px-1"></footer>
  </main>
</div>

<div id="dock" class="dock">
  <div class="mx-auto max-w-[560px]">
    <button id="addBtn" class="addbtn" data-act="add-exp"><span class="plus" aria-hidden="true">+</span>Расход</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input id="importFile" type="file" hidden aria-label="Файл с данными сметы">

<!-- Ввод расхода / пополнения -->
<div id="entry" class="sheet" role="dialog" aria-modal="true" aria-labelledby="entryTitle" hidden>
  <div class="sheet-nav">
    <button id="entryCancel" class="nav-cancel">Отмена</button>
    <h2 id="entryTitle">Новый расход</h2>
    <button id="entrySave" class="nav-save">Сохранить</button>
  </div>
  <div class="sheet-body">
    <div class="mx-auto max-w-[560px] flex flex-col gap-5">
      <div id="modeSeg" class="seg" role="group" aria-label="Что добавляем">
        <button id="modeExp" data-mode="exp" aria-pressed="true">Расход</button>
        <button id="modeFund" data-mode="fund" aria-pressed="false">Пополнение</button>
      </div>

      <div class="amount-box">
        <label for="fAmount" class="lbl" style="margin-bottom:0">Сумма</label>
        <div class="flex items-baseline gap-2">
          <input id="fAmount" class="amount" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" aria-describedby="fCalc">
          <span class="cur" aria-hidden="true">₽</span>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button class="opchip" data-op="+" aria-label="Прибавить ещё сумму">+ ещё</button>
          <button class="opchip" data-op="×" aria-label="Умножить на количество">× кол-во</button>
          <span id="fCalc" class="text-[13.5px] font-semibold c-muted num"></span>
        </div>
      </div>

      <div id="catBlock">
        <p class="lbl">Категория</p>
        <div id="fChips" class="chips" role="group" aria-label="Категория"></div>
        <div id="fCatInfo" class="mt-3"></div>
      </div>

      <div id="srcBlock" hidden>
        <p class="lbl">Откуда деньги</p>
        <div id="fSrc" class="chips" role="group" aria-label="Источник"></div>
      </div>

      <div id="typeBlock">
        <p class="lbl">Тип</p>
        <div id="fType" class="seg" role="group" aria-label="Тип"></div>
      </div>

      <div>
        <label id="fTitleLbl" for="fTitle" class="lbl">Что купили</label>
        <input id="fTitle" class="field" autocomplete="off" placeholder="Например: клей плиточный">
      </div>

      <div id="noteWrap">
        <button id="noteToggle" class="link">+ примечание (счёт, чек, договор)</button>
        <div id="noteField" hidden>
          <label for="fNote" class="lbl">Примечание</label>
          <textarea id="fNote" class="field" rows="2" placeholder="Например: стройдвор, счёт №2118317310"></textarea>
        </div>
      </div>

      <div>
        <label for="fDate" class="lbl">Дата</label>
        <input id="fDate" type="date" class="field">
      </div>

      <p id="fErr" class="err" role="alert"></p>
      <button id="entrySave2" class="bigbtn">Сохранить</button>
      <button id="entryDel" class="delbtn" hidden>Удалить</button>
    </div>
  </div>
</div>

<!-- Настройка категории -->
<div id="catSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="catTitle" hidden>
  <div class="sheet-nav">
    <button id="catCancel" class="nav-cancel">Закрыть</button>
    <h2 id="catTitle">Категория</h2>
    <button id="catSave" class="nav-save">Сохранить</button>
  </div>
  <div class="sheet-body">
    <div class="mx-auto max-w-[560px] flex flex-col gap-5">
      <div id="cSummary"></div>
      <div>
        <label for="cName" class="lbl">Название</label>
        <input id="cName" class="field" autocomplete="off" placeholder="Например: Освещение">
      </div>
      <div>
        <p class="lbl">Тип по умолчанию</p>
        <div id="cType" class="seg" role="group" aria-label="Тип по умолчанию"></div>
      </div>
      <div>
        <label for="cLimit" class="lbl">Лимит (план), ₽</label>
        <input id="cLimit" class="field num" inputmode="decimal" autocomplete="off" placeholder="Без лимита">
        <p id="cLimitNote" class="text-[13px] c-muted mt-2"></p>
      </div>
      <p id="cErr" class="err" role="alert"></p>
      <button id="catSave2" class="bigbtn">Сохранить</button>
      <div id="cList"></div>
      <button id="catHide" class="delbtn" hidden>Скрыть категорию</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Справочники (из листа «Факт», колонка «Наименование») ---------- */
  var DEFAULT_CATS = [
    { id: 'podryad', name: 'Подрядчики', xl: 'ремонтники/подрядчики', type: 'Работа', order: 1 },
    { id: 'mebel', name: 'Мебель', xl: 'мебель', type: 'Материалы', order: 2 },
    { id: 'chern', name: 'Черновые', xl: 'черновые товары', type: 'Материалы', order: 3 },
    { id: 'elektr', name: 'Электрика', xl: 'электрика товары', type: 'Материалы', order: 4 },
    { id: 'plitka', name: 'Плитка', xl: 'плитка', type: 'Материалы', order: 5 },
    { id: 'santeh', name: 'Сантехника', xl: 'сантехника товары', type: 'Материалы', order: 6 },
    { id: 'dizain', name: 'Дизайнер', xl: 'Дизайнер', type: 'Работа', order: 7 },
    { id: 'dostavka', name: 'Доставка', xl: 'доставка', type: 'Работа', order: 8 },
    { id: 'demont', name: 'Демонтаж', xl: 'демонтаж товары', type: 'Материалы', order: 9 }
  ];
  var SOURCES = [
    { id: 'own', name: 'Свои' },
    { id: 'mama', name: 'Мама', debt: true },
    { id: 'card', name: 'Кредитка', debt: true },
    { id: 'other', name: 'Другое' }
  ];
  var TYPES = ['Работа', 'Материалы'];
  var COLL = { exp: 'expenses', fund: 'funds', cats: 'cats' };
  var LS_KEY = 'smeta-remonta-local-v1';
  var META_KEY = 'smeta-remonta-meta-v1';

  /* ---------- Состояние ---------- */
  var S = {
    exp: [], fund: [], catDocs: [],
    mode: 'loading', // loading | db | local
    loaded: { exp: false, fund: false, cats: false },
    confirmed: { exp: false, fund: false, cats: false },
    stale: false, err: null, canWrite: true,
    showAllExp: false, showAllFund: false
  };
  var db = null;
  var F = { open: false, kind: 'exp', id: null, cat: null, type: 'Материалы', src: 'own', del: false, triedSave: false };
  var C = { open: false, id: null, type: 'Материалы', hideArmed: false };

  /* ---------- Утилиты ---------- */
  function $(s) { return document.querySelector(s); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function round2(n) { return Math.round(n * 100) / 100; }
  var NF0 = new Intl.NumberFormat('ru-RU', { maximumFractionDigits: 0 });
  var NF2 = new Intl.NumberFormat('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
  function rub(n) { return NF0.format(Math.round(n)) + ' ₽'; }
  function rub2(n) { return NF2.format(round2(n)) + ' ₽'; }
  function plain(n) { return String(round2(n)).replace('.', ','); }
  var MON_S = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  var MON = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  function todayISO() {
    var t = new Date();
    return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0');
  }
  function fdate(iso) {
    if (!iso) return '';
    var p = iso.split('-').map(Number);
    var cy = new Date().getFullYear();
    return p[2] + ' ' + MON_S[p[1] - 1] + (p[0] !== cy ? ' ' + p[0] : '');
  }
  function ddmmyyyy(iso) { if (!iso) return ''; var p = iso.split('-'); return p[2] + '.' + p[1] + '.' + p[0]; }
  function newId(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function clean(obj) {
    var o = {};
    Object.keys(obj).forEach(function (k) { if (k !== 'id' && obj[k] !== undefined) o[k] = obj[k]; });
    return o;
  }
  function sumOf(list) { return list.reduce(function (s, x) { return s + num(x.amount); }, 0); }
  function pct(a, b) { return b > 0 ? Math.round(a / b * 100) : 0; }

  /* Сумма: «1 500», «1500,5», «33694,6+4041», «8,604×2263» */
  function parseAmount(raw) {
    var s = String(raw == null ? '' : raw).replace(/[\s  ₽]/g, '').replace(/,/g, '.').replace(/[×xXхХ*]/g, '*');
    s = s.replace(/[+\-*]+$/, '');
    if (!s) return null;
    if (!/^[0-9.+\-*]+$/.test(s)) return NaN;
    var terms = s.split(/(?=[+\-])/), total = 0;
    for (var i = 0; i < terms.length; i++) {
      var t = terms[i], sign = 1;
      if (t[0] === '+') t = t.slice(1); else if (t[0] === '-') { sign = -1; t = t.slice(1); }
      if (!t) return NaN;
      var fs = t.split('*'), prod = 1;
      for (var j = 0; j < fs.length; j++) {
        if (!/^(\d+\.?\d*|\.\d+)$/.test(fs[j])) return NaN;
        prod *= parseFloat(fs[j]);
      }
      total += sign * prod;
    }
    return round2(total);
  }

  /* ---------- Хранилище: db артефакта, иначе localStorage этого браузера ---------- */
  function lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || null; } catch (e) { return null; } }
  function metaRead() { try { return JSON.parse(localStorage.getItem(META_KEY)) || {}; } catch (e) { return {}; } }
  function metaWrite(m) { try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) { /* не критично */ } }
  var persistAsked = false;
  function lsWrite(silent) {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ exp: S.exp, fund: S.fund, catDocs: S.catDocs })); }
    catch (e) { throw { code: 'local' }; }
    if (!silent) { var m = metaRead(); m.changedAt = Date.now(); metaWrite(m); }
    /* Просим браузер не удалять данные при нехватке места */
    if (!persistAsked && navigator.storage && navigator.storage.persist) { persistAsked = true; navigator.storage.persist().catch(function () {}); }
  }
  function backupState() {
    var m = metaRead(), has = S.exp.length + S.fund.length > 0;
    var days = m.backupAt ? Math.floor((Date.now() - m.backupAt) / 86400000) : null;
    var changed = !m.backupAt || num(m.changedAt) > m.backupAt;
    return { has: has, days: days, stale: has && changed && (days === null || days >= 7) };
  }
  function arrFor(kind) { return kind === 'exp' ? S.exp : kind === 'fund' ? S.fund : S.catDocs; }
  function findRec(kind, id) { var a = arrFor(kind); for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function withRetry(fn) {
    try { return await fn(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); return await fn(); }
      throw e;
    }
  }
  async function put(kind, id, data) {
    var body = clean(data);
    if (db) { await withRetry(function () { return db.collection(COLL[kind]).doc(id).set(body); }); return; }
    var a = arrFor(kind), row = Object.assign({ id: id }, body), i = a.findIndex(function (x) { return x.id === id; });
    if (i >= 0) a[i] = row; else a.push(row);
    try { lsWrite(); } finally { render(); }
  }
  async function del(kind, id) {
    if (db) { await withRetry(function () { return db.collection(COLL[kind]).doc(id).delete(); }); return; }
    var a = arrFor(kind), i = a.findIndex(function (x) { return x.id === id; });
    if (i >= 0) a.splice(i, 1);
    try { lsWrite(); } finally { render(); }
  }
  function errText(e) {
    var c = e && e.code;
    if (c === 'local') return 'память браузера переполнена или недоступна';
    if (c === 'invalid_argument') return 'нет прав на изменение этой сметы';
    if (c === 'quota_exceeded') return 'хранилище переполнено';
    if (c === 'resource_exhausted') return 'слишком часто, подождите пару секунд';
    return 'нет связи с хранилищем';
  }

  /* ---------- Расчёты ---------- */
  function allCats() {
    var map = new Map();
    DEFAULT_CATS.forEach(function (c) { map.set(c.id, Object.assign({ limit: null }, c)); });
    S.catDocs.forEach(function (d) { map.set(d.id, Object.assign({}, map.get(d.id) || { order: 50, type: 'Материалы' }, d)); });
    S.exp.forEach(function (e) {
      if (e.cat && !map.has(e.cat)) map.set(e.cat, { id: e.cat, name: e.cat, type: e.type || 'Материалы', order: 99, limit: null });
    });
    return Array.from(map.values());
  }
  function derive() {
    var cats = allCats(), catMap = new Map(cats.map(function (c) { return [c.id, c]; }));
    var spent = sumOf(S.exp), funded = sumOf(S.fund);
    var byCat = new Map(), byType = { 'Работа': 0, 'Материалы': 0 }, lastUse = new Map(), bySrc = new Map();
    S.exp.forEach(function (e) {
      var a = num(e.amount);
      byCat.set(e.cat, (byCat.get(e.cat) || 0) + a);
      byType[e.type === 'Работа' ? 'Работа' : 'Материалы'] += a;
      var k = (e.date || '') + '|' + String(e.createdAt || 0).padStart(15, '0');
      if (!lastUse.has(e.cat) || lastUse.get(e.cat) < k) lastUse.set(e.cat, k);
    });
    S.fund.forEach(function (f) { var s = f.source || 'other'; bySrc.set(s, (bySrc.get(s) || 0) + num(f.amount)); });
    var toPay = 0;
    cats.forEach(function (c) { if (!c.hidden && num(c.limit) > 0) toPay += Math.max(0, num(c.limit) - (byCat.get(c.id) || 0)); });
    return { cats: cats, catMap: catMap, spent: spent, funded: funded, left: funded - spent, byCat: byCat, byType: byType, lastUse: lastUse, bySrc: bySrc, toPay: toPay };
  }
  function sortDesc(list) {
    return list.slice().sort(function (a, b) {
      return (b.date || '').localeCompare(a.date || '') || num(b.createdAt) - num(a.createdAt) || num(b.no) - num(a.no) || String(b.id).localeCompare(String(a.id));
    });
  }
  function loadedAll() { return S.loaded.exp && S.loaded.fund && S.loaded.cats; }
  function catName(d, id) { var c = d.catMap.get(id); return c ? c.name : (id || 'Без категории'); }

  /* ---------- Отрисовка ---------- */
  function tape(fill, opts) {
    opts = opts || {};
    var w = Math.max(0, Math.min(100, fill * 100));
    var cls = 'tape' + (opts.lg ? ' lg' : '') + (opts.over ? ' over' : '') + (opts.free ? ' free' : '');
    return '<div class="' + cls + '" role="presentation"><i style="--w:' + w.toFixed(1) + '%"></i></div>';
  }

  function renderStatus() {
    var el = $('#status'), cls = 'status pb-1', txt;
    if (S.mode === 'loading') txt = 'загрузка…';
    else if (S.mode === 'local') { var bs = backupState(); cls += bs.stale ? ' warn' : ' ok'; txt = bs.stale ? 'пора сделать копию' : 'на этом устройстве'; }
    else if (S.err) { cls += ' bad'; txt = 'хранилище недоступно'; }
    else if (S.stale) { cls += ' warn'; txt = 'нет связи, данные могут устареть'; }
    else { cls += ' ok'; txt = S.canWrite ? 'синхронизировано' : 'только просмотр'; }
    el.className = cls;
    el.innerHTML = '<i></i><span>' + esc(txt) + '</span>';
  }

  function renderSummary(d) {
    if (!loadedAll()) {
      return '<div class="panel p-5 flex flex-col gap-3">' +
        '<p class="eyebrow">Остаток на ремонт</p>' +
        '<p class="disp text-[40px] font-semibold leading-none skel">— ₽</p>' + tape(0, { lg: true }) +
        '<p class="text-[13.5px] c-muted">' + (S.stale ? 'Не удаётся связаться с хранилищем. Проверьте интернет — данные подгрузятся сами.' : 'Загружаю расходы и пополнения…') + '</p></div>';
    }
    if (!S.exp.length && !S.fund.length) {
      return '<div class="panel p-5 flex flex-col gap-3">' +
        '<p class="eyebrow">Остаток на ремонт</p>' +
        '<p class="disp text-[40px] font-semibold leading-none">0 ₽</p>' + tape(0, { lg: true }) +
        '<p class="text-[14px] c-muted">Записей пока нет. Если у вас есть файл с данными (smeta-dannye.json или резервная копия), загрузите его — траты, пополнения и лимиты появятся сразу. Или начните с нуля кнопкой «+ Расход» внизу.</p>' +
        '<button class="bigbtn mt-1" data-act="import">Загрузить из файла</button></div>';
    }
    var state = d.left < 0 ? 'bad' : (d.funded > 0 && d.left / d.funded < 0.05) ? 'warn' : 'ok';
    var pillTxt = { ok: 'в бюджете', warn: 'почти всё потрачено', bad: 'перерасход' }[state];
    var ratio = d.funded > 0 ? d.spent / d.funded : 1;
    var h = '<div class="panel p-5 flex flex-col gap-3">' +
      '<div class="flex items-center justify-between gap-3"><p class="eyebrow">Остаток на ремонт</p><span class="pill ' + state + '">' + pillTxt + '</span></div>' +
      '<p class="disp text-[38px] sm:text-[42px] font-semibold leading-none num c-' + state + '">' + (d.left < 0 ? '−' : '') + rub(Math.abs(d.left)) + '</p>' +
      tape(ratio, { lg: true, over: d.left < 0 }) +
      '<div class="flex flex-wrap justify-between gap-x-4 gap-y-1 text-[13.5px]">' +
      '<span><span class="c-muted">Потрачено</span> <b class="num">' + rub(d.spent) + '</b> <span class="c-muted">· ' + pct(d.spent, d.funded) + '%</span></span>' +
      '<span><span class="c-muted">Внесено</span> <b class="num">' + rub(d.funded) + '</b></span></div>';
    if (d.toPay > 0) {
      var after = d.left - d.toPay;
      h += '<div class="border-t pt-3 mt-1 flex flex-col gap-1 text-[13.5px]" style="border-color:var(--line)">' +
        '<div class="flex justify-between gap-3"><span class="c-muted">Ещё к оплате по лимитам категорий</span><b class="num">' + rub(d.toPay) + '</b></div>' +
        '<div class="flex justify-between gap-3"><span class="c-muted">' + (after < 0 ? 'Не хватит денег' : 'После этого останется') + '</span><b class="num ' + (after < 0 ? 'c-bad' : 'c-ok') + '">' + rub(Math.abs(after)) + '</b></div></div>';
    }
    return h + '</div>';
  }

  function renderSplit(d) {
    if (!loadedAll() || !S.exp.length) return '';
    var w = d.byType['Работа'], m = d.byType['Материалы'], t = w + m || 1;
    return '<div class="panel p-4 flex flex-col gap-3">' +
      '<div class="grid grid-cols-2 gap-3">' +
      '<div class="min-w-0"><p class="eyebrow flex items-center gap-2"><span style="width:9px;height:9px;border-radius:2px;background:var(--ink);display:inline-block"></span>Работа</p>' +
      '<p class="disp text-[17px] font-semibold num mt-1">' + rub(w) + '</p><p class="text-[12.5px] c-muted">' + pct(w, t) + '% всех трат</p></div>' +
      '<div class="min-w-0"><p class="eyebrow flex items-center gap-2"><span style="width:9px;height:9px;border-radius:2px;background:var(--tape);display:inline-block"></span>Материалы</p>' +
      '<p class="disp text-[17px] font-semibold num mt-1">' + rub(m) + '</p><p class="text-[12.5px] c-muted">' + pct(m, t) + '% всех трат</p></div>' +
      '</div>' +
      '<div class="split" role="presentation"><i style="width:' + (w / t * 100).toFixed(1) + '%;background:var(--ink)"></i><i style="flex:1;background:var(--tape)"></i></div>' +
      '</div>';
  }

  function expRow(d, e) {
    var title = e.title || catName(d, e.cat);
    var meta = fdate(e.date) + ' · ' + catName(d, e.cat) + ' · ' + (e.type || '');
    var tag = S.canWrite ? 'button' : 'div';
    return '<' + tag + ' class="row" data-act="edit-exp" data-id="' + esc(e.id) + '">' +
      '<span class="min-w-0 flex-1"><span class="t">' + esc(title) + '</span><span class="m block">' + esc(meta) + '</span></span>' +
      '<span class="a">' + rub2(num(e.amount)) + '</span></' + tag + '>';
  }

  function renderRecent(d) {
    if (!loadedAll() || !S.exp.length) return '';
    var list = sortDesc(S.exp);
    var h = '<div class="sec-h"><h2>' + (S.showAllExp ? 'Все расходы' : 'Последние расходы') + '</h2>' +
      (list.length > 5 ? '<button class="link" data-act="toggle-exp">' + (S.showAllExp ? 'Свернуть' : 'Все · ' + list.length) + '</button>' : '') + '</div>';
    h += '<div class="list">';
    if (!S.showAllExp) {
      list.slice(0, 5).forEach(function (e) { h += expRow(d, e); });
    } else {
      var groups = [], cur = null;
      list.forEach(function (e) {
        var k = (e.date || '').slice(0, 7);
        if (!cur || cur.k !== k) { cur = { k: k, items: [], sum: 0 }; groups.push(cur); }
        cur.items.push(e); cur.sum += num(e.amount);
      });
      groups.forEach(function (g) {
        var p = g.k.split('-').map(Number);
        h += '<div class="mhead"><span>' + (p[1] ? MON[p[1] - 1] + ' ' + p[0] : 'Без даты') + '</span><span class="num">' + rub(g.sum) + '</span></div>';
        g.items.forEach(function (e) { h += expRow(d, e); });
      });
    }
    return h + '</div>';
  }

  function renderCats(d) {
    if (!loadedAll()) return '';
    var cats = d.cats.filter(function (c) { return !c.hidden; }).sort(function (a, b) {
      return (d.byCat.get(b.id) || 0) - (d.byCat.get(a.id) || 0) || num(a.order) - num(b.order);
    });
    var h = '<div class="sec-h"><h2>Категории: план и факт</h2></div><div class="list">';
    cats.forEach(function (c) {
      var s = d.byCat.get(c.id) || 0, lim = num(c.limit), tag = S.canWrite ? 'button' : 'div', bar, meta;
      if (lim > 0) {
        var rest = lim - s;
        bar = tape(s / lim, { over: rest < 0 });
        meta = '<span>план ' + rub(lim) + '</span><span class="font-bold ' + (rest < -0.5 ? 'c-bad' : rest >= 0.5 && rest / lim < 0.1 ? 'c-warn' : 'c-ok') + '">' +
          (rest < -0.5 ? 'перерасход ' + rub(-rest) : rest < 0.5 ? 'оплачено полностью' : 'осталось ' + rub(rest)) + '</span>';
      } else {
        bar = tape(d.spent > 0 ? s / d.spent : 0, { free: true });
        meta = '<span>' + pct(s, d.spent) + '% всех трат</span><span>' + (S.canWrite ? 'задать лимит →' : 'лимит не задан') + '</span>';
      }
      h += '<' + tag + ' class="catrow" data-act="cat" data-id="' + esc(c.id) + '">' +
        '<span class="flex items-baseline justify-between gap-3"><span class="font-bold min-w-0" style="overflow-wrap:anywhere">' + esc(c.name) +
        ' <span class="font-semibold text-[12.5px] c-muted">· ' + esc(c.type) + '</span></span><span class="font-bold num whitespace-nowrap">' + rub(s) + '</span></span>' +
        bar + '<span class="flex justify-between gap-3 text-[12.5px] c-muted">' + meta + '</span></' + tag + '>';
    });
    if (S.canWrite) h += '<button class="row" data-act="new-cat"><span class="font-bold">+ Новая категория</span></button>';
    return h + '</div>';
  }

  function srcName(id) { for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return SOURCES[i].name; return 'Другое'; }
  function srcDebt(id) { for (var i = 0; i < SOURCES.length; i++) if (SOURCES[i].id === id) return !!SOURCES[i].debt; return false; }

  function renderFunds(d) {
    if (!loadedAll()) return '';
    var h = '<div class="sec-h"><h2>Деньги на ремонт</h2>' +
      (S.fund.length ? '<button class="link" data-act="toggle-fund">' + (S.showAllFund ? 'Свернуть' : 'Все пополнения · ' + S.fund.length) + '</button>' : '') + '</div><div class="list">';
    var debt = 0;
    SOURCES.forEach(function (s) {
      var v = d.bySrc.get(s.id) || 0;
      if (!v) return;
      if (s.debt) debt += v;
      h += '<div class="row"><span class="flex-1 min-w-0 font-bold">' + esc(s.name) + (s.debt ? ' <span class="pill warn" style="margin-left:6px">в долг</span>' : '') +
        '</span><span class="a">' + rub(v) + '</span></div>';
    });
    if (!S.fund.length) h += '<div class="row"><span class="m">Пополнений пока нет. Внесите сумму, отложенную на ремонт, чтобы видеть остаток.</span></div>';
    if (S.showAllFund) {
      sortDesc(S.fund).forEach(function (f) {
        var tag = S.canWrite ? 'button' : 'div';
        h += '<' + tag + ' class="row" data-act="edit-fund" data-id="' + esc(f.id) + '">' +
          '<span class="min-w-0 flex-1"><span class="t">' + esc(f.note || srcName(f.source)) + '</span><span class="m block">' + esc(fdate(f.date) + ' · ' + srcName(f.source)) + '</span></span>' +
          '<span class="a c-ok">+' + rub2(num(f.amount)) + '</span></' + tag + '>';
      });
    }
    h += '</div>';
    if (debt > 0) h += '<p class="text-[13px] c-muted px-1 mt-2">Из них в долг: <b class="num" style="color:var(--ink)">' + rub(debt) + '</b> — мама и кредитка.</p>';
    if (S.canWrite) h += '<button class="ghost w-full mt-3" data-act="add-fund">+ Пополнение</button>';
    return h;
  }

  function renderFoot() {
    if (!loadedAll() || (!S.exp.length && !S.fund.length)) return '';
    var st = backupState();
    var when = st.days === null ? 'копий ещё не было' : st.days === 0 ? 'копия сегодня' : 'копия ' + st.days + ' дн. назад';
    return '<div class="panel p-4 flex flex-col gap-3">' +
      '<div class="flex items-center justify-between gap-3"><p class="font-bold">Резервная копия</p><span class="pill ' + (st.stale ? 'warn' : 'ok') + '">' + esc(when) + '</span></div>' +
      '<p class="text-[13px] c-muted">Записи хранятся только в памяти этого браузера. Раз в неделю сохраняйте копию в «Файлы», на Google Диск или в Telegram: с ней данные восстанавливаются на любом телефоне.</p>' +
      '<div class="grid grid-cols-2 gap-2"><button class="ghost" data-act="backup">Сохранить копию</button><button class="ghost" data-act="import">Загрузить из файла</button></div></div>' +
      '<div class="grid grid-cols-2 gap-2">' +
      '<button class="ghost" data-act="export-exp">Расходы → Excel</button>' +
      '<button class="ghost" data-act="export-fund">Пополнения → Excel</button></div>' +
      '<textarea id="copyBox" class="field copybox" readonly hidden aria-label="Текст для вставки в Excel"></textarea>' +
      '<p class="text-[12.5px] c-muted">Кнопки «→ Excel» копируют таблицу в буфер обмена в порядке колонок листа «Факт» — вставьте её в Excel с ячейки B2.</p>';
  }

  function render() {
    var d = derive();
    renderStatus();
    $('#summary').innerHTML = renderSummary(d);
    $('#split').innerHTML = renderSplit(d);
    $('#recent').innerHTML = renderRecent(d);
    $('#catsec').innerHTML = renderCats(d);
    $('#fundsec').innerHTML = renderFunds(d);
    var foot = $('#foot'), box = $('#copyBox'), keep = box && !box.hidden ? box.value : null;
    foot.innerHTML = renderFoot();
    if (keep !== null && $('#copyBox')) { $('#copyBox').hidden = false; $('#copyBox').value = keep; }
    $('#dock').hidden = !S.canWrite || S.mode === 'loading';
    if (F.open) renderForm(d);
    if (C.open) renderCatSheet(d);
  }

  /* ---------- Тост с отменой ---------- */
  var toastTimer = null, toastFn = null;
  function toast(msg, action) {
    var t = $('#toast');
    t.className = 'toast' + (action ? '' : ' solo');
    t.innerHTML = '<span>' + esc(msg) + '</span>' + (action ? '<button data-act="toast-act">' + esc(action.label) + '</button>' : '');
    toastFn = action ? action.fn : null;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; toastFn = null; }, action ? 6500 : 3200);
  }
  function undoAction(kind, id, before) {
    return {
      label: 'Отменить',
      fn: function () {
        var p = before ? put(kind, id, before) : del(kind, id);
        p.then(function () { toast('Отменено'); }, function (e) { toast('Не удалось отменить: ' + errText(e)); });
      }
    };
  }

  /* ---------- Панель ввода ---------- */
  function lockBody(on) { document.body.classList.toggle('locked', on); }
  function showSheet(el) {
    clearTimeout(el._hideT);
    el.hidden = false; lockBody(true);
    requestAnimationFrame(function () { requestAnimationFrame(function () { el.classList.add('open'); }); });
  }
  function hideSheet(el) {
    el.classList.remove('open');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    clearTimeout(el._hideT);
    el._hideT = setTimeout(function () { el.hidden = true; if (!F.open && !C.open) lockBody(false); }, reduce ? 0 : 200);
  }

  function openEntry(kind, id) {
    var rec = id ? findRec(kind, id) : null;
    if (id && !rec) return;
    F.kind = kind; F.id = id || null; F.del = false; F.triedSave = false;
    F.cat = rec && rec.cat ? rec.cat : null;
    F.type = rec && rec.type ? rec.type : 'Материалы';
    F.src = rec && rec.source ? rec.source : 'own';
    $('#fAmount').value = rec ? plain(num(rec.amount)) : '';
    $('#fTitle').value = rec ? (kind === 'exp' ? (rec.title || '') : (rec.note || '')) : '';
    $('#fNote').value = rec && kind === 'exp' ? (rec.note || '') : '';
    $('#noteField').hidden = !(rec && kind === 'exp' && rec.note);
    $('#fDate').value = rec && rec.date ? rec.date : todayISO();
    $('#fErr').textContent = '';
    F.open = true;
    renderForm(derive());
    var el = $('#entry');
    showSheet(el);
    el.querySelector('.sheet-body').scrollTop = 0;
    if (!id) { try { $('#fAmount').focus({ preventScroll: true }); } catch (e) { $('#fAmount').focus(); } }
  }
  function closeEntry() { F.open = false; $('#fAmount').blur(); hideSheet($('#entry')); }

  function chipOrder(d) {
    return d.cats.filter(function (c) { return !c.hidden; }).sort(function (a, b) {
      var la = d.lastUse.get(a.id) || '', lb = d.lastUse.get(b.id) || '';
      return lb.localeCompare(la) || num(a.order) - num(b.order);
    });
  }

  function renderForm(d) {
    d = d || derive();
    var isExp = F.kind === 'exp';
    $('#entryTitle').textContent = F.id ? (isExp ? 'Расход' : 'Пополнение') : (isExp ? 'Новый расход' : 'Пополнение');
    $('#modeSeg').hidden = !!F.id;
    $('#modeExp').setAttribute('aria-pressed', String(isExp));
    $('#modeFund').setAttribute('aria-pressed', String(!isExp));
    $('#catBlock').hidden = !isExp;
    $('#typeBlock').hidden = !isExp;
    $('#srcBlock').hidden = isExp;
    $('#noteWrap').hidden = !isExp;
    $('#noteToggle').hidden = !$('#noteField').hidden;
    $('#fTitleLbl').textContent = isExp ? 'Что купили · за что' : 'Комментарий';
    $('#fTitle').placeholder = isExp ? 'Например: клей плиточный, стройдвор' : 'Например: с зарплаты';
    $('#entryDel').hidden = !F.id;
    $('#entryDel').className = 'delbtn' + (F.del ? ' armed' : '');
    $('#entryDel').textContent = F.del ? 'Точно удалить? Нажмите ещё раз' : 'Удалить';

    if (isExp) {
      var chips = chipOrder(d).map(function (c) {
        return '<button class="chip' + (F.triedSave && !F.cat ? ' attn' : '') + '" data-cat="' + esc(c.id) + '" aria-pressed="' + (F.cat === c.id) + '">' + esc(c.name) + '</button>';
      }).join('');
      $('#fChips').innerHTML = chips;
      $('#fType').innerHTML = TYPES.map(function (t) {
        return '<button data-type="' + t + '" aria-pressed="' + (F.type === t) + '">' + t + '</button>';
      }).join('');
      renderCatInfo(d);
    } else {
      $('#fSrc').innerHTML = SOURCES.map(function (s) {
        return '<button class="chip" data-src="' + s.id + '" aria-pressed="' + (F.src === s.id) + '">' + esc(s.name) + (s.debt ? ' · в долг' : '') + '</button>';
      }).join('');
    }
    renderCalc();
  }

  function renderCatInfo(d) {
    var box = $('#fCatInfo');
    if (!F.cat) { box.innerHTML = '<p class="text-[13px] c-muted">' + (F.triedSave ? '<span class="c-bad font-bold">Выберите категорию</span>' : 'Сначала часто используемые. Тип подставится сам.') + '</p>'; return; }
    d = d || derive();
    var c = d.catMap.get(F.cat); if (!c) { box.innerHTML = ''; return; }
    var spent = d.byCat.get(c.id) || 0;
    var a = parseAmount($('#fAmount').value);
    var prev = F.id ? findRec('exp', F.id) : null;
    var base = prev && prev.cat === c.id ? spent - num(prev.amount) : spent;
    var add = a > 0 ? a : 0;
    var lim = num(c.limit), h = '<div class="infobox">';
    if (lim > 0) {
      var restNow = lim - base, restAfter = restNow - add;
      h += '<div class="flex justify-between gap-3"><span class="c-muted">Осталось в «' + esc(c.name) + '»</span><b class="num ' + (restNow < 0 ? 'c-bad' : '') + '">' + rub(restNow) + '</b></div>';
      h += tape((base + add) / lim, { over: restAfter < 0 });
      if (add) h += '<div class="flex justify-between gap-3"><span class="c-muted">После этой траты</span><b class="num ' + (restAfter < 0 ? 'c-bad' : 'c-ok') + '">' + (restAfter < 0 ? 'перерасход ' + rub(-restAfter) : rub(restAfter)) + '</b></div>';
      h += '<span class="c-muted">План ' + rub(lim) + ', потрачено ' + rub(base) + '</span>';
    } else {
      h += '<div class="flex justify-between gap-3"><span class="c-muted">Потрачено в «' + esc(c.name) + '»</span><b class="num">' + rub(base) + '</b></div>';
      if (add) h += '<div class="flex justify-between gap-3"><span class="c-muted">С этой тратой</span><b class="num">' + rub(base + add) + '</b></div>';
      h += '<span class="c-muted">Лимит не задан — задайте его в разделе «Категории», и здесь появится остаток.</span>';
    }
    box.innerHTML = h + '</div>';
  }

  function renderCalc() {
    var raw = $('#fAmount').value, a = parseAmount(raw), el = $('#fCalc');
    if (a === null) { el.textContent = ''; return; }
    if (isNaN(a)) { el.innerHTML = '<span class="c-bad">Не понял сумму: цифры, «+» и «×»</span>'; return; }
    el.textContent = /[+\-*×xXхХ]/.test(raw.replace(/^[+\-]/, '')) ? '= ' + rub2(a) : '';
  }

  async function saveEntry() {
    var a = parseAmount($('#fAmount').value);
    F.triedSave = true;
    if (!(a > 0)) { $('#fErr').textContent = 'Введите сумму больше нуля'; $('#fAmount').focus(); return; }
    if (F.kind === 'exp' && !F.cat) { $('#fErr').textContent = 'Выберите категорию'; renderForm(); return; }
    var kind = F.kind, prev = F.id ? findRec(kind, F.id) : null, id = F.id || newId(kind === 'exp' ? 'e' : 'f');
    var date = $('#fDate').value || todayISO(), doc;
    if (kind === 'exp') {
      doc = Object.assign({}, prev ? clean(prev) : {}, {
        date: date, title: $('#fTitle').value.trim(), cat: F.cat, type: F.type, amount: a, note: $('#fNote').value.trim()
      });
      if (prev && round2(num(prev.amount)) !== a) { delete doc.qty; delete doc.price; }
    } else {
      doc = Object.assign({}, prev ? clean(prev) : {}, { date: date, amount: a, source: F.src, note: $('#fTitle').value.trim() });
    }
    if (!prev) doc.createdAt = Date.now();
    var before = prev ? clean(prev) : null;
    var d = derive();
    var label = kind === 'exp' ? rub2(a) + ' · ' + catName(d, F.cat) : '+' + rub2(a) + ' · ' + srcName(F.src);
    closeEntry();
    try {
      await put(kind, id, doc);
      toast((prev ? 'Изменено: ' : 'Сохранено: ') + label, undoAction(kind, id, before));
    } catch (e) {
      toast('Не сохранилось — ' + errText(e), { label: 'Повторить', fn: function () { put(kind, id, doc).then(function () { toast('Сохранено: ' + label); }, function (e2) { toast('Снова не вышло — ' + errText(e2)); }); } });
    }
  }

  async function deleteEntry() {
    if (!F.del) { F.del = true; renderForm(); return; }
    var kind = F.kind, id = F.id, prev = findRec(kind, id);
    closeEntry();
    try {
      await del(kind, id);
      toast('Удалено', prev ? undoAction(kind, id, clean(prev)) : null);
    } catch (e) { toast('Не удалилось — ' + errText(e)); }
  }

  /* ---------- Панель категории ---------- */
  function openCat(id) {
    var d = derive(), c = id ? d.catMap.get(id) : null;
    C.id = id || null; C.type = c ? c.type || 'Материалы' : 'Материалы'; C.hideArmed = false; C.open = true;
    $('#cName').value = c ? c.name : '';
    $('#cLimit').value = c && num(c.limit) > 0 ? plain(num(c.limit)) : '';
    $('#cErr').textContent = '';
    renderCatSheet(d);
    var el = $('#catSheet');
    showSheet(el);
    el.querySelector('.sheet-body').scrollTop = 0;
    if (!id) { try { $('#cName').focus({ preventScroll: true }); } catch (e) { $('#cName').focus(); } }
  }
  function closeCat() { C.open = false; hideSheet($('#catSheet')); }

  function renderCatSheet(d) {
    d = d || derive();
    var c = C.id ? d.catMap.get(C.id) : null;
    $('#catTitle').textContent = c ? c.name : 'Новая категория';
    $('#cType').innerHTML = TYPES.map(function (t) { return '<button data-ctype="' + t + '" aria-pressed="' + (C.type === t) + '">' + t + '</button>'; }).join('');
    var spent = c ? d.byCat.get(c.id) || 0 : 0, lim = c ? num(c.limit) : 0;
    $('#cLimitNote').textContent = c && c.limitNote ? 'Откуда план: ' + c.limitNote : 'Сколько готовы потратить на категорию. Оставьте пустым — будет без лимита.';
    if (c) {
      var h = '<div class="panel p-4 flex flex-col gap-2"><div class="flex justify-between gap-3"><span class="c-muted">Потрачено</span><b class="num">' + rub2(spent) + '</b></div>';
      if (lim > 0) {
        h += tape(spent / lim, { over: spent > lim });
        h += '<div class="flex justify-between gap-3 text-[13.5px]"><span class="c-muted">План ' + rub(lim) + '</span><b class="num ' + (spent > lim ? 'c-bad' : 'c-ok') + '">' + (spent > lim ? 'перерасход ' + rub(spent - lim) : 'осталось ' + rub(lim - spent)) + '</b></div>';
      }
      $('#cSummary').innerHTML = h + '</div>';
    } else { $('#cSummary').innerHTML = ''; }
    var items = c ? sortDesc(S.exp.filter(function (e) { return e.cat === c.id; })) : [];
    $('#cList').innerHTML = items.length ? '<p class="lbl">Траты в категории · ' + items.length + '</p><div class="list">' + items.map(function (e) { return expRow(d, e); }).join('') + '</div>' : '';
    var hb = $('#catHide');
    hb.hidden = !c || items.length > 0;
    hb.className = 'delbtn' + (C.hideArmed ? ' armed' : '');
    hb.textContent = C.hideArmed ? 'Точно скрыть? Нажмите ещё раз' : 'Скрыть категорию';
  }

  async function saveCat() {
    var name = $('#cName').value.trim();
    if (!name) { $('#cErr').textContent = 'Введите название'; $('#cName').focus(); return; }
    var limRaw = $('#cLimit').value.trim(), lim = limRaw ? parseAmount(limRaw) : null;
    if (limRaw && !(lim >= 0)) { $('#cErr').textContent = 'Лимит — это число, например 150000'; return; }
    var d = derive(), base = C.id ? d.catMap.get(C.id) : null, id = C.id || newId('c');
    var doc = {
      name: name, type: C.type, limit: lim && lim > 0 ? lim : null,
      order: base && base.order != null ? base.order : 50,
      xl: base && base.xl ? base.xl : name.toLowerCase()
    };
    if (base && base.limitNote && num(base.limit) === num(doc.limit)) doc.limitNote = base.limitNote;
    var before = base && findRec('cats', base.id) ? clean(findRec('cats', base.id)) : null;
    closeCat();
    try { await put('cats', id, doc); toast('Категория сохранена', before ? undoAction('cats', id, before) : null); }
    catch (e) { toast('Не сохранилось — ' + errText(e)); }
  }
  async function hideCat() {
    if (!C.hideArmed) { C.hideArmed = true; renderCatSheet(); return; }
    var d = derive(), c = d.catMap.get(C.id); if (!c) return;
    var doc = clean(c); doc.hidden = true; delete doc.id;
    closeCat();
    try { await put('cats', c.id, doc); toast('Категория скрыта'); } catch (e) { toast('Не вышло — ' + errText(e)); }
  }

  /* ---------- Экспорт в Excel (TSV в буфер) ---------- */
  function cell(s) { return String(s == null ? '' : s).replace(/[\t\r\n]+/g, ' ').trim(); }
  function xn(n) { return String(round2(num(n))).replace('.', ','); }
  function copyText(text, okMsg) {
    var fallback = function () {
      var ta = $('#copyBox'); if (!ta) return;
      ta.hidden = false; ta.value = text; ta.focus(); ta.select();
      toast('Текст выделен ниже — скопируйте его вручную');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { toast(okMsg); }, fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  function exportExp() {
    var d = derive();
    var list = sortDesc(S.exp).reverse();
    var rows = [['№', 'Этап', 'Дата', 'Наименование', 'Тип', 'Ед.изм', 'Кол-во', 'Цена', 'Стоимость', 'Примечание'].join('\t')];
    list.forEach(function (e, i) {
      var c = d.catMap.get(e.cat);
      rows.push([i + 1, cell(e.title), ddmmyyyy(e.date), cell(c ? c.xl || c.name : e.cat), cell(e.type), cell(e.unit || '-'),
        xn(e.qty != null ? e.qty : 1), xn(e.price != null ? e.price : e.amount), xn(e.amount), cell(e.note)].join('\t'));
    });
    copyText(rows.join('\n'), 'Скопировано ' + list.length + ' строк — вставьте в лист «Факт» с B2');
  }
  function exportFund() {
    var list = sortDesc(S.fund).reverse();
    var rows = [['Дата зачисления', 'Сумма', 'Источник', 'Комментарий'].join('\t')];
    list.forEach(function (f) { rows.push([ddmmyyyy(f.date), xn(f.amount), srcName(f.source) + (srcDebt(f.source) ? ' (в долг)' : ''), cell(f.note)].join('\t')); });
    copyText(rows.join('\n'), 'Скопировано ' + list.length + ' пополнений');
  }

  /* ---------- События ---------- */
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act === 'add-exp') openEntry('exp');
    else if (act === 'add-fund') openEntry('fund');
    else if (act === 'edit-exp' && S.canWrite) { if (C.open) closeCat(); openEntry('exp', id); }
    else if (act === 'edit-fund' && S.canWrite) openEntry('fund', id);
    else if (act === 'toggle-exp') { S.showAllExp = !S.showAllExp; render(); }
    else if (act === 'toggle-fund') { S.showAllFund = !S.showAllFund; render(); }
    else if (act === 'cat' && S.canWrite) openCat(id);
    else if (act === 'new-cat') openCat(null);
    else if (act === 'export-exp') exportExp();
    else if (act === 'export-fund') exportFund();
    else if (act === 'toast-act') { $('#toast').hidden = true; if (toastFn) { var f = toastFn; toastFn = null; f(); } }
  });

  $('#entryCancel').addEventListener('click', closeEntry);
  $('#entrySave').addEventListener('click', saveEntry);
  $('#entrySave2').addEventListener('click', saveEntry);
  $('#entryDel').addEventListener('click', deleteEntry);
  $('#modeSeg').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-mode]'); if (!b || F.id) return;
    F.kind = b.getAttribute('data-mode'); F.triedSave = false; $('#fErr').textContent = '';
    renderForm();
  });
  $('#fChips').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-cat]'); if (!b) return;
    F.cat = b.getAttribute('data-cat');
    var c = derive().catMap.get(F.cat);
    if (c && c.type) F.type = c.type;
    $('#fErr').textContent = '';
    renderForm();
  });
  $('#fType').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-type]'); if (!b) return; F.type = b.getAttribute('data-type'); renderForm();
  });
  $('#fSrc').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-src]'); if (!b) return; F.src = b.getAttribute('data-src'); renderForm();
  });
  $('#fAmount').addEventListener('input', function () { $('#fErr').textContent = ''; renderCalc(); if (F.kind === 'exp') renderCatInfo(); });
  $('#fAmount').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); saveEntry(); } });
  $('#fTitle').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); saveEntry(); } });
  document.querySelectorAll('[data-op]').forEach(function (b) {
    b.addEventListener('click', function () {
      var inp = $('#fAmount'), v = inp.value.replace(/[+\-*×]+\s*$/, '');
      if (!v) { inp.focus(); return; }
      inp.value = v + b.getAttribute('data-op');
      inp.focus();
      try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) { /* не все поля поддерживают */ }
      renderCalc();
    });
  });
  $('#noteToggle').addEventListener('click', function () { $('#noteField').hidden = false; $('#noteToggle').hidden = true; $('#fNote').focus(); });

  $('#catCancel').addEventListener('click', closeCat);
  $('#catSave').addEventListener('click', saveCat);
  $('#catSave2').addEventListener('click', saveCat);
  $('#catHide').addEventListener('click', hideCat);
  $('#cType').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-ctype]'); if (!b) return; C.type = b.getAttribute('data-ctype'); renderCatSheet();
  });
  $('#cLimit').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); saveCat(); } });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape') return;
    if (F.open) closeEntry(); else if (C.open) closeCat();
  });

  /* ---------- Резервная копия ---------- */
  function markBackup() { var m = metaRead(); m.backupAt = Date.now(); metaWrite(m); render(); }
  function backup() {
    var name = 'smeta-remonta-' + todayISO() + '.json';
    var payload = { app: 'smeta-remonta', version: 1, savedAt: new Date().toISOString(), exp: S.exp, fund: S.fund, catDocs: S.catDocs };
    var blob = new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
    var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
    var file = null;
    try { file = new File([blob], name, { type: 'application/json' }); } catch (e) { file = null; }
    function download() {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = name; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      markBackup();
      toast('Файл ' + name + ' сохранён в «Загрузки»');
    }
    /* На телефоне — меню «Поделиться»: «Сохранить в Файлы», Google Диск, Telegram */
    if (coarse && file && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Смета ремонта — копия' }).then(function () {
        markBackup(); toast('Копия сохранена');
      }, function (e) { if (!e || e.name !== 'AbortError') download(); });
      return;
    }
    download();
  }

  /* ---------- Загрузка из файла ---------- */
  function validImport(o) {
    function ok(list) { return Array.isArray(list) && list.every(function (x) { return x && typeof x.id === 'string' && isFinite(Number(x.amount)); }); }
    return !!o && typeof o === 'object' && ok(o.exp) && ok(o.fund) && (o.catDocs == null || Array.isArray(o.catDocs));
  }
  function copyRows(list) { return (list || []).map(function (x) { return Object.assign({}, x); }); }
  function applyImport(o) {
    var prev = { exp: S.exp, fund: S.fund, catDocs: S.catDocs };
    S.exp = copyRows(o.exp); S.fund = copyRows(o.fund); S.catDocs = copyRows(o.catDocs);
    try { lsWrite(true); }
    catch (e) { S.exp = prev.exp; S.fund = prev.fund; S.catDocs = prev.catDocs; render(); toast('Не загрузилось — ' + errText(e)); return; }
    var m = metaRead(); m.backupAt = Date.now(); m.changedAt = Date.now() - 1; metaWrite(m);
    render();
    toast('Загружено: ' + S.exp.length + ' трат, ' + S.fund.length + ' пополнений', {
      label: 'Отменить',
      fn: function () {
        S.exp = prev.exp; S.fund = prev.fund; S.catDocs = prev.catDocs;
        try { lsWrite(); toast('Отменено'); } catch (e) { toast('Не удалось отменить — ' + errText(e)); }
        render();
      }
    });
  }
  function readImportFile(file) {
    if (!file) return;
    var r = new FileReader();
    r.onload = function () {
      var o = null;
      try { o = JSON.parse(String(r.result).replace(/^﻿/, '')); } catch (e) { o = null; }
      if (!validImport(o)) { toast('Этот файл не подходит: нужен .json, сохранённый этим приложением'); return; }
      if (S.exp.length || S.fund.length) {
        toast('В файле ' + o.exp.length + ' трат и ' + o.fund.length + ' пополнений. Текущие записи заменятся.', { label: 'Заменить', fn: function () { applyImport(o); } });
      } else applyImport(o);
    };
    r.onerror = function () { toast('Не удалось прочитать файл'); };
    r.readAsText(file);
  }
  $('#importFile').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    readImportFile(f);
    ev.target.value = '';
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (!t) return;
    var act = t.getAttribute('data-act');
    if (act === 'backup') backup();
    else if (act === 'import') $('#importFile').click();
  });

  /* ---------- Запуск ---------- */
  function loadLocal() {
    var o = lsRead();
    S.exp = o && o.exp ? o.exp : []; S.fund = o && o.fund ? o.fund : []; S.catDocs = o && o.catDocs ? o.catDocs : [];
  }
  function init() {
    S.mode = 'local';
    loadLocal();
    S.loaded = { exp: true, fund: true, cats: true };
    render();
    /* Изменения из другой вкладки с этой же страницей */
    window.addEventListener('storage', function (ev) { if (ev.key === LS_KEY) { loadLocal(); render(); } });
    /* Офлайн-режим и установка на экран «Домой» (работает по https:// или с localhost) */
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () { /* без офлайн-режима страница всё равно работает */ });
    }
  }
  init();
})();
</script>
</body>
</html>
